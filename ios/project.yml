# XcodeGen spec for the GupBudget iPhone app. The .xcodeproj and Sources/Info.plist are generated by `xcodegen generate`
# on the macOS runner and are not checked in. web/ (the bundled web UI) is built by scripts/build-mobile-web.mjs and is
# not checked in either: the public build copy gets it built (scripts/publish-public.sh). This file goes into that
# public copy too: nothing personal here.
name: GupBudget
options:
  bundleIdPrefix: app.gupbudget
  deploymentTarget:
    iOS: "16.0"
targets:
  GupBudget:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      # the built web UI, copied in as a folder so the app bundle keeps web/index.html and web/fonts/
      - path: web
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: GupBudget
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBG
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIUserInterfaceStyle: Dark
        CADisableMinimumFrameDurationOnPhone: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # pairing: the app scans the QR code the PC shows (the camera picture never leaves the phone). No URL scheme
        # is registered (CFBundleURLTypes): only this scanner reads pairing links, so no website can push one.
        NSCameraUsageDescription: >-
          GupBudget uses the camera only to scan the pairing code your PC shows. Nothing is recorded or sent anywhere.
        # app lock and money-plan decisions (iOS checks the face; the app only hears "passed" or "not")
        NSFaceIDUsageDescription: >-
          GupBudget uses Face ID to unlock the app and to confirm each budget decision you make on your iPhone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gupbudget.mobile
        PRODUCT_NAME: GupBudget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
